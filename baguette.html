<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Baguette — Chef d'orchestre VR</title>
<style>
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #101018; color: #e8e6df;
         display: flex; flex-direction: column; align-items: center; padding: 24px; gap: 16px;
         -webkit-user-select: none; user-select: none; }
  h1 { font-size: 20px; color: #ffd27a; margin: 0; }
  input { font-size: 32px; width: 140px; text-align: center; padding: 8px; border-radius: 10px; border: none; }
  button { font-size: 18px; padding: 14px 22px; border-radius: 12px; border: none; background: #ffd27a; color: #2a1d10; }
  #etat { min-height: 1.4em; text-align: center; }
  #rond { width: 160px; height: 160px; border-radius: 50%; background: #2a2a38; transition: background .08s; }
  label { width: 100%; max-width: 320px; }
  input[type=range] { width: 100%; }
  .petit { font-size: 13px; opacity: .7; text-align: center; max-width: 320px; }
</style>
</head>
<body>
<h1>Baguette iPhone</h1>
<div>Code affiché sur le Mac :</div>
<input id="code" inputmode="numeric" maxlength="4" placeholder="0000">
<button id="go">Connecter</button>
<div id="etat"></div>
<div id="rond"></div>
<label>Sensibilité : <span id="vs"></span>
  <input id="seuil" type="range" min="4" max="30" step="1" value="12">
</label>
<div class="petit">Tiens l'iPhone comme une baguette et bats la mesure.
  Chaque temps est détecté au point bas du geste (quand le mouvement vers le bas s'arrête net).
  Plus le geste est ample et vif, plus l'orchestre joue fort.</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const seuil = $('seuil');
const majSeuil = () => { $('vs').textContent = seuil.value + ' m/s²'; };
seuil.oninput = majSeuil; majSeuil();

let conn = null;
let dernier = 0;
let pic = 0, enPic = false;

function flash(force) {
  const r = $('rond');
  r.style.background = `rgb(255, ${210 - 120 * force}, ${122 - 100 * force})`;
  setTimeout(() => { r.style.background = '#2a2a38'; }, 90);
}

// Accélération vers le haut (sens opposé à la pesanteur) : forte au point bas du geste
function mouvement(e) {
  const a = e.acceleration, g0 = e.accelerationIncludingGravity;
  if (!a || !g0 || a.x === null) return;
  const gx = g0.x - a.x, gy = g0.y - a.y, gz = g0.z - a.z;      // pesanteur seule
  const n = Math.hypot(gx, gy, gz) || 1;
  const versLeHaut = -(a.x * gx + a.y * gy + a.z * gz) / n;     // m/s²
  const s = Number(seuil.value);
  const t = performance.now();
  if (versLeHaut > s) {
    enPic = true;
    pic = Math.max(pic, versLeHaut);
  } else if (enPic) {
    enPic = false;
    if (t - dernier > 250) {
      dernier = t;
      const force = Math.min(1, Math.max(0, (pic - s) / (2 * s)));
      flash(force);
      if (conn && conn.open) conn.send({ type: 'ictus', force });
    }
    pic = 0;
  }
}

$('go').onclick = async () => {
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
      const r = await DeviceMotionEvent.requestPermission();
      if (r !== 'granted') { $('etat').textContent = 'Accès aux mouvements refusé.'; return; }
    }
    window.addEventListener('devicemotion', mouvement);
  } catch (e) {
    $('etat').textContent = 'Erreur capteurs : ' + e.message; return;
  }
  const code = $('code').value.trim();
  if (!/^\d{4}$/.test(code)) { $('etat').textContent = 'Saisis le code à 4 chiffres affiché sur le Mac.'; return; }
  $('etat').textContent = 'Connexion…';
  const peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect('chef-orchestre-vr-' + code, { reliable: false });
    conn.on('open', () => { $('etat').textContent = 'Connecté. Bats la mesure !'; });
    conn.on('close', () => { $('etat').textContent = 'Déconnecté.'; });
    conn.on('error', (e) => { $('etat').textContent = 'Erreur : ' + e; });
  });
  peer.on('error', (e) => { $('etat').textContent = 'Erreur : ' + e.type + ' (code correct ? page du Mac ouverte ?)'; });
};
</script>
</body>
</html>
